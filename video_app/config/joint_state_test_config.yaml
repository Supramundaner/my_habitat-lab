# 关节状态测试配置：验证机器人关节运动对FPV的影响
scene:
  scene_path: "/home/yaoaa/habitat-lab/data/scene_datasets/hm3d/minival/00800-TEEsavR23oF/TEEsavR23oF.basis.glb"
  
agents:
  - name: "joint_tester"
    agent_model_path: "/home/yaoaa/anaconda3/lib/python3.11/site-packages/habitat_sim/robots/fetch_robot.urdf"
    initial_position: [0.0, 0.0, 0.0]
    initial_rotation: [0.0, 0.0, 0.0]
    is_physical: true
    
actions:
  joint_tester:
    - action: "move_to"
      target_position: [1.0, 0.0, 1.0]
      duration: 2.0
    - action: "set_joint_state"
      joint_name: "head_pan_joint"
      joint_value: 0.5  # 向左转45度左右
      duration: 1.0
    - action: "wait"
      duration: 0.5
    - action: "set_joint_state"
      joint_name: "head_pan_joint" 
      joint_value: -0.5  # 向右转45度左右
      duration: 1.0
    - action: "wait"
      duration: 0.5
    - action: "set_joint_state"
      joint_name: "head_tilt_joint"
      joint_value: 0.3  # 抬头
      duration: 1.0
    - action: "wait"
      duration: 0.5
    - action: "set_joint_state"
      joint_name: "head_tilt_joint"
      joint_value: -0.3  # 低头
      duration: 1.0
    - action: "wait"
      duration: 0.5
    - action: "set_joint_state"
      joint_name: "torso_lift_joint"
      joint_value: 0.3  # 升高躯干
      duration: 2.0
    - action: "wait"
      duration: 1.0

# 视频配置
video:
  fps: 30
  resolution: [640, 480]
  enable_video: true
  
# 仿真配置
simulation:
  physics_enabled: true
  enable_collision_detection: false
  movement_smoothness: 0.02
  rotation_smoothness: 0.05
