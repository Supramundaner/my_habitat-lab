# Advanced Collision Detection Test Configuration
# 高级碰撞检测测试配置文件

# 场景配置
scene:
  # 使用测试场景
  scene_dataset_path: "data/scene_datasets/habitat-test-scenes/apartment_1.glb"
  scene_id: null
  
# 模拟器配置
simulator:
  gpu_device_id: 0
  enable_physics: true  # 必须启用物理引擎进行高级碰撞检测
  random_seed: 42
  enable_gfx_replay_save: false

# 智能体配置 - 减少为2个智能体便于测试
agents:
  - id: "agent_0"
    # 如果没有物理机器人文件，将使用虚拟智能体
    agent_model_path: null
    sensors:
      color_sensor:
        sensor_type: "COLOR"
        resolution: [256, 256]  # 降低分辨率提高性能
        position: [0.0, 1.5, 0.0]
        hfov: 90.0
    action_space:
      move_forward:
        amount: 0.25
      move_backward:
        amount: 0.25
      turn_left:
        amount: 15.0
      turn_right:
        amount: 15.0
    initial_position: null
    initial_rotation: [0, 0, 0, 1]

  - id: "agent_1"
    agent_model_path: null
    sensors:
      color_sensor:
        sensor_type: "COLOR"
        resolution: [256, 256]
        position: [0.0, 1.5, 0.0]
        hfov: 90.0
    action_space:
      move_forward:
        amount: 0.25
      move_backward:
        amount: 0.25
      turn_left:
        amount: 15.0
      turn_right:
        amount: 15.0
    initial_position: null
    initial_rotation: [0, 0, 0, 1]

# 高级碰撞检测配置
collision_detection:
  enabled: true
  agent_radius: 0.15                # 稍大的半径提高检测敏感度
  height_threshold: 0.3
  prediction_steps: 15              # 更多预测步数
  min_agent_distance: 1.0           # 更大的安全距离
  raycast_steps: 25                 # 更多射线检测步数
  contact_threshold: 0.005          # 更小的接触阈值

# 视频输出配置 - 优化用于测试
video_output:
  output_dir: "./outputs/collision_tests"
  fps: 20                          # 降低帧率提高性能
  resolution: [512, 1024]         # [height, width] - 左右分屏
  codec: "MJPG"                    # 使用更兼容的编码器
  save_frames: false

# 地图配置
map_config:
  resolution: 512                  # 降低分辨率
  show_grid: true
  grid_interval: 0.5
  agent_marker_size: 6
  agent_marker_color: [255, 100, 100]
  direction_arrow_length: 12

# 运动参数 - 较慢的速度便于观察
movement:
  linear_speed: 0.5              # 降低移动速度
  angular_speed: 20.0            # 降低旋转速度
  time_step: 0.05                # 更大的时间步长
  path_interpolation_points: 15

# 日志配置
logging:
  log_file: "./outputs/collision_tests/advanced_collision_test.log"
  log_level: "INFO"
  console_output: true

# 状态保存配置
state_persistence:
  state_file: "./outputs/collision_tests/agent_states.json"
  save_after_each_action: true
  save_final_state: true
